# Server
server.port=8080

# Database - Docker configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:db}:3306/fintrack?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA — schema is managed by Flyway (src/main/resources/db/migration);
# Hibernate only verifies the mapping matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway — databases that predate Flyway (created by ddl-auto=update) are
# baselined at V1 so the baseline DDL is skipped and only later migrations run.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT — access tokens are short-lived; sessions persist via rotating refresh
# tokens delivered in an httpOnly cookie (see AuthController).
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:900000}
auth.refresh-expiration-ms=${REFRESH_EXPIRATION_MS:1209600000}
auth.cookie-secure=${AUTH_COOKIE_SECURE:true}

# OpenAI
openai.api.key=${OPENAI_API_KEY:your-openai-api-key}
openai.api.url=https://api.openai.com/v1/chat/completions
openai.model=gpt-4o-mini

# Plaid (sign up at dashboard.plaid.com for free sandbox keys)
plaid.client-id=${PLAID_CLIENT_ID:}
plaid.secret=${PLAID_SECRET:}
plaid.env=${PLAID_ENV:sandbox}
plaid.webhook-url=${PLAID_WEBHOOK_URL:}
# Base64-encoded 256-bit AES key for encrypting Plaid access tokens.
# Generate with: openssl rand -base64 32
plaid.encryption-key=${PLAID_ENCRYPTION_KEY:}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS
cors.allowed.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# Reverse proxies in front of the app (the shipped docker-compose runs behind one
# nginx). Controls how X-Forwarded-For is trusted for rate limiting. Set to 0 if
# the app is exposed directly with no proxy.
security.trusted-proxy-count=${TRUSTED_PROXY_COUNT:1}

# Logging
logging.level.com.fintrack=INFO

# Health check endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
